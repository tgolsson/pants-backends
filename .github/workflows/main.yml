name: Python application

on:
  push:
    branches: [ "main" ]

  pull_request:

permissions:
  contents: read

env:
  PANTS_DISABLE_GETS: '1'

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Initialize Pants
      uses: pantsbuild/actions/init-pants@main
      with:
        gha-cache-key: cache1-test-py3.11-pants2.31.0
        named-caches-hash: ${{ hashFiles('pants-plugins/*.lock') }}

    - name: Test everything
      run: |
        ./get-pants.sh
        sudo sh -c 'echo "runner:100000:65536" > /etc/subuid'
        sudo sh -c 'echo "runner:100000:65536" > /etc/subgid'
        /home/runner/bin/pants test ::

  package:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Initialize Pants
      uses: pantsbuild/actions/init-pants@main
      with:
        # cache0 makes it easy to bust the cache if needed
        gha-cache-key: cache1-package-py3.11-pants2.31.0
        named-caches-hash: ${{ hashFiles('pants-plugins/*.lock') }}

    - name: Package all targets
      run: |
        ./get-pants.sh
        id
        id -u
        id -g
        sudo sh -c 'echo "runner:100000:65536" > /etc/subuid'
        sudo sh -c 'echo "runner:100000:65536" > /etc/subgid'
        docker run --rm --cap-drop all --cap-add CAP_SETGID ubuntu:22.04 cat /proc/self/gid_map
        docker run --rm --cap-drop all --cap-add CAP_SETUID ubuntu:22.04 cat /proc/self/uid_map

        # The multistage example's build steps need a shell its distroless base doesn't have.
        /home/runner/bin/pants --filter-address-regex='^((?!multistage).)*$' package ::

  package-examples:

    strategy:
      matrix:
        os: ["ubuntu-22.04", "macos-15"]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Set up Xcode version
      if: runner.os == 'macOS'
      run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

    - name: Initialize Pants
      uses: pantsbuild/actions/init-pants@main
      with:
        # cache0 makes it easy to bust the cache if needed
        gha-cache-key: cache1-package-py3.11-pants2.31.0
        named-caches-hash: ${{ hashFiles('pants-plugins/*.lock') }}

    - name: Package all targets
      run: |
        ./get-pants.sh

        id
        id -u
        id -g

        sudo sh -c 'echo "runner:100000:65536" > /etc/subuid'
        sudo sh -c 'echo "runner:100000:65536" > /etc/subgid'
        podman run --rm --cap-drop all --cap-add CAP_SETGID ubuntu:22.04 cat /proc/self/gid_map || true
        podman run --rm --cap-drop all --cap-add CAP_SETUID ubuntu:22.04 cat /proc/self/uid_map || true

        # Scripted build steps need local Linux podman, which macOS runners don't have.
        if [ "$RUNNER_OS" = "macOS" ]; then
          pants --filter-address-regex='^((?!multistage|scripted).)*$' package examples::
        else
          pants --filter-address-regex='^((?!multistage).)*$' package examples::
        fi

  check-and-lint:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Run linters on all targets
      run: |
        ./get-pants.sh
        /home/runner/bin/pants update-build-files --check lint ::

  validate-tailor:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Validate that tailor files are up to date
      run: |
        ./get-pants.sh
        /home/runner/bin/pants tailor --check ::
