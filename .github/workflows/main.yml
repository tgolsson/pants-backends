name: Python application

on:
  push:
    branches: [ "main" ]

  pull_request:

permissions:
  contents: read

env:
  PANTS_DISABLE_GETS: '1'

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    # science (run by pex to build the oci-builder and apt-resolver scies) looks up the pinned
    # python-build-standalone release through GitHub's API, and hosted runners hit the anonymous
    # rate limit (a-scie/lift#127). It reads `~/.netrc`, which, unlike an env var, stays out of
    # Pants' process cache keys.
    - name: Authenticate GitHub API requests
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        umask 077
        printf 'machine api.github.com\nlogin x-access-token\npassword %s\n' "$GITHUB_TOKEN" > ~/.netrc

    - name: Initialize Pants
      uses: pantsbuild/actions/init-pants@main
      with:
        gha-cache-key: cache1-test-py3.14-pants2.32.1
        named-caches-hash: ${{ hashFiles('pants-plugins/*.lock') }}

    - name: Test everything
      run: |
        ./get-pants.sh
        sudo sh -c 'echo "runner:100000:65536" > /etc/subuid'
        sudo sh -c 'echo "runner:100000:65536" > /etc/subgid'
        /home/runner/bin/pants test ::

  package:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    # science (run by pex to build the oci-builder and apt-resolver scies) looks up the pinned
    # python-build-standalone release through GitHub's API, and hosted runners hit the anonymous
    # rate limit (a-scie/lift#127). It reads `~/.netrc`, which, unlike an env var, stays out of
    # Pants' process cache keys.
    - name: Authenticate GitHub API requests
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        umask 077
        printf 'machine api.github.com\nlogin x-access-token\npassword %s\n' "$GITHUB_TOKEN" > ~/.netrc

    - name: Initialize Pants
      uses: pantsbuild/actions/init-pants@main
      with:
        # cache0 makes it easy to bust the cache if needed
        gha-cache-key: cache1-package-py3.14-pants2.32.1
        named-caches-hash: ${{ hashFiles('pants-plugins/*.lock') }}

    - name: Package all targets
      run: |
        ./get-pants.sh
        id
        id -u
        id -g
        sudo sh -c 'echo "runner:100000:65536" > /etc/subuid'
        sudo sh -c 'echo "runner:100000:65536" > /etc/subgid'
        docker run --rm --cap-drop all --cap-add CAP_SETGID ubuntu:22.04 cat /proc/self/gid_map
        docker run --rm --cap-drop all --cap-add CAP_SETUID ubuntu:22.04 cat /proc/self/uid_map

        /home/runner/bin/pants package ::

  package-examples:

    strategy:
      matrix:
        os: ["ubuntu-24.04", "macos-15"]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Xcode version
      if: runner.os == 'macOS'
      run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

    # science (run by pex to build the oci-builder and apt-resolver scies) looks up the pinned
    # python-build-standalone release through GitHub's API, and hosted runners hit the anonymous
    # rate limit (a-scie/lift#127). It reads `~/.netrc`, which, unlike an env var, stays out of
    # Pants' process cache keys.
    - name: Authenticate GitHub API requests
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        umask 077
        printf 'machine api.github.com\nlogin x-access-token\npassword %s\n' "$GITHUB_TOKEN" > ~/.netrc

    - name: Initialize Pants
      uses: pantsbuild/actions/init-pants@main
      with:
        # cache0 makes it easy to bust the cache if needed
        gha-cache-key: cache1-package-py3.14-pants2.32.1
        named-caches-hash: ${{ hashFiles('pants-plugins/*.lock') }}

    - name: Package all targets
      run: |
        ./get-pants.sh

        id
        id -u
        id -g

        sudo sh -c 'echo "runner:100000:65536" > /etc/subuid'
        sudo sh -c 'echo "runner:100000:65536" > /etc/subgid'
        podman run --rm --cap-drop all --cap-add CAP_SETGID ubuntu:22.04 cat /proc/self/gid_map || true
        podman run --rm --cap-drop all --cap-add CAP_SETUID ubuntu:22.04 cat /proc/self/uid_map || true

        # Scripted build steps need local Linux podman, which macOS runners don't have; the
        # multistage and scripted examples use them.
        if [ "$RUNNER_OS" = "macOS" ]; then
          pants --filter-address-regex='^((?!multistage|scripted).)*$' package examples::
        else
          pants package examples::
        fi

  docker-runner:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    # science (run by pex to build the oci-builder and apt-resolver scies) looks up the pinned
    # python-build-standalone release through GitHub's API, and hosted runners hit the anonymous
    # rate limit (a-scie/lift#127). It reads `~/.netrc`, which, unlike an env var, stays out of
    # Pants' process cache keys.
    - name: Authenticate GitHub API requests
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        umask 077
        printf 'machine api.github.com\nlogin x-access-token\npassword %s\n' "$GITHUB_TOKEN" > ~/.netrc

    - name: Initialize Pants
      uses: pantsbuild/actions/init-pants@main
      with:
        gha-cache-key: cache1-docker-runner-py3.14-pants2.32.1
        named-caches-hash: ${{ hashFiles('pants-plugins/*.lock') }}

    # `[oci].runner = "docker"` on a machine with Docker and no podman.
    - name: Run and script images with Docker
      env:
        PANTS_BACKEND_PACKAGES: "+['pants.backend.docker','pants_backend_oci.docker']"
        PANTS_OCI_RUNNER: docker
      run: |
        ./get-pants.sh
        sudo apt-get remove -y podman
        ! command -v podman
        docker version

        /home/runner/bin/pants package examples/oci/scripted:: examples/oci/multistage::
        /home/runner/bin/pants run examples/oci/debian:nonroot | tee run.out
        grep -qx 'uid=65532(nonroot) gid=65532(nonroot) groups=65532(nonroot)' run.out
        OCI_TEST_DOCKER=1 /home/runner/bin/pants test \
          pants-plugins/oci/pants_backend_oci/goals/run_integration_test.py \
          pants-plugins/oci/pants_backend_oci/util_rules/scripted_integration_test.py \
          -- -k docker

  # `pants run` and repl through a podman connection, as macOS podman machine uses. Hosted macOS
  # runners can't boot the machine's VM, so a local podman service stands in for it.
  podman-remote:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    # science (run by pex to build the oci-builder and apt-resolver scies) looks up the pinned
    # python-build-standalone release through GitHub's API, and hosted runners hit the anonymous
    # rate limit (a-scie/lift#127). It reads `~/.netrc`, which, unlike an env var, stays out of
    # Pants' process cache keys.
    - name: Authenticate GitHub API requests
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        umask 077
        printf 'machine api.github.com\nlogin x-access-token\npassword %s\n' "$GITHUB_TOKEN" > ~/.netrc

    - name: Initialize Pants
      uses: pantsbuild/actions/init-pants@main
      with:
        gha-cache-key: cache1-podman-remote-py3.14-pants2.32.1
        named-caches-hash: ${{ hashFiles('pants-plugins/*.lock') }}

    - name: Run images through a podman connection
      env:
        PANTS_OCI_PODMAN_CONNECTION: pants-ci
      run: |
        ./get-pants.sh
        sudo sh -c 'echo "runner:100000:65536" > /etc/subuid'
        sudo sh -c 'echo "runner:100000:65536" > /etc/subgid'
        podman system service --time=0 "unix://$RUNNER_TEMP/podman.sock" &
        timeout 30 sh -c "until [ -S '$RUNNER_TEMP/podman.sock' ]; do sleep 1; done"
        podman system connection add pants-ci "unix://$RUNNER_TEMP/podman.sock"

        /home/runner/bin/pants run examples/oci/debian:nonroot | tee run.out
        grep -qx 'uid=65532(nonroot) gid=65532(nonroot) groups=65532(nonroot)' run.out
        podman --connection pants-ci image ls --filter reference=localhost/pants-oci-run
        OCI_TEST_PODMAN_REMOTE=pants-ci /home/runner/bin/pants test \
          pants-plugins/oci/pants_backend_oci/goals/run_integration_test.py -- -k remote

  check-and-lint:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Run linters on all targets
      run: |
        ./get-pants.sh
        /home/runner/bin/pants update-build-files --check lint ::

  validate-tailor:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Validate that tailor files are up to date
      run: |
        ./get-pants.sh
        /home/runner/bin/pants tailor --check ::
