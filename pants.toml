[GLOBAL]
pants_version = "2.32.1"
build_file_prelude_globs = ["examples/macros.py"]

pythonpath = [
   "%(buildroot)s/pants-plugins/kustomize",
   "%(buildroot)s/pants-plugins/oci",
   "%(buildroot)s/pants-plugins/k8s",
   "%(buildroot)s/pants-plugins/mdbook",
   "%(buildroot)s/pants-plugins/bitwarden",
   "%(buildroot)s/pants-plugins/secrets",
   "%(buildroot)s/pants-plugins/odin",
   "%(buildroot)s/pants-plugins/cmake",
   "%(buildroot)s/pants-plugins/distroless",
   "%(buildroot)s/pants-plugins/generate",
   "%(buildroot)s/pants-plugins/platforms",
]

backend_packages = [
  "pants.backend.python",
  "pants.backend.python.providers.experimental.python_build_standalone",
  "pants.backend.experimental.python",

  "pants.backend.python.lint.isort",
  "pants.backend.python.lint.flake8",

  "pants.backend.plugin_development",
  "pants_backend_mdbook",
  "pants_backend_kustomize",
  "pants_backend_k8s",
  "pants_backend_oci",
  "pants_backend_oci.utility.mirror",
  "pants_backend_distroless",
  "pants_backend_bitwarden",
  "pants_backend_secrets",

  "pants.backend.shell",
  "pants.backend.experimental.python.lint.ruff.check",
  "pants.backend.experimental.python.lint.ruff.format",
  "pants.backend.experimental.adhoc"
]

pants_ignore = [
    ".*/",
    "/dist/",
    "__pycache__",
    "**/pdm_build.py",
    "/examples/odin/"
]

[source]
root_patterns = [
  '/',
  '/pants-plugins',
  '/examples/oci',
]
marker_filenames = ["pyproject.toml"]

[apt.resolves]
bookworm = "examples/oci/debian/bookworm.lock.json"
noble = "examples/oci/ubuntu/noble.lock.json"

[anonymous-telemetry]
enabled = true
repo_id = "e32e6905-7a7d-405f-82b1-86d2723b0c4d"

[python]
tailor_pex_binary_targets = true
interpreter_constraints = ["==3.14.*"]
enable_resolves = true
separate_lockfile_metadata_file = true
default_resolve = "pants-plugins"


[python.resolves]
pants-plugins = "pants-plugins/pants.lock"
example-1 = "locks/example-1.lock"

twine = "locks/tools/twine.lock"
pytest = "locks/tools/pytest.lock"
isort = "locks/tools/isort.lock"
ipython = "locks/tools/ipython.lock"
black = "locks/tools/black.lock"


[python.resolves_to_interpreter_constraints]
pants-plugins = ["==3.14.*"]
pytest = ["==3.14.*"]
twine = ["==3.14.*"]
black = ["==3.14.*"]
example-1 = ["==3.13.*"]

[python-infer]
use_rust_parser = true

[black]
install_from_resolve = "black"
interpreter_constraints = ["==3.14.*"]

[ipython]
install_from_resolve = "ipython"

[isort]
install_from_resolve = "isort"
args = '--resolve-all-configs'
interpreter_constraints = ["==3.14.*"]
config = "['pyproject.toml']"

[pytest]
args = ["--no-header"]
execution_slot_var = "TEST_EXECUTION_SLOT"
install_from_resolve = "pytest"

[twine]
install_from_resolve = "twine"
