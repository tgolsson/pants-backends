[project]
name = "pants_backend_distroless"
description = "A distroless image plugin for the Pants build system"
version = "0.1.0"
authors = [
    { name = "Tom Solberg", email = "me@sbg.dev" }
]

dependencies = [

]

readme = "README.md"
license = {file = "LICENSE-MIT.txt"}
keywords = ["pantsbuild", "pants", "backend", "distroless", "debian", "apt", "oci"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Repository = "https://github.com/tgolsson/pants-backends"
Code = "https://github.com/tgolsson/pants-backends/tree/main/pants-plugins/distroless"
Changelog = "https://github.com/tgolsson/pants-backends/tree/main/pants-plugins/distroless/CHANGELOG.md"

[tool.pdm.build]
includes = [
    "pants_backend_distroless",
]

[build-system]
requires = ["pdm-backend>=2.0.0"]
build-backend = "pdm.backend"

[tool.isort]
profile = "black"

known_first_party = ["pants_backend_distroless"]
line_length = 100
include_trailing_comma = true

[tool.black]
line-length = 100
