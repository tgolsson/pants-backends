[project]
name = "pants_backend_cmake"
description = "A CMake backend for the Pants build system that replays the generated Ninja graph as cached per-edge processes."
version = "0.1.0"
authors = [
    { name = "Tom Solberg", email = "me@sbg.dev" }
]

dependencies = []
readme = "README.md"
license = {file = "LICENSE-MIT.txt"}
keywords = ["pantsbuild", "pants", "backend", "cmake", "ninja", "c", "c++"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Repository = "https://github.com/tgolsson/pants-backends"
Code = "https://github.com/tgolsson/pants-backends/tree/main/pants-plugins/cmake"
Changelog = "https://github.com/tgolsson/pants-backends/tree/main/pants-plugins/cmake/CHANGELOG.md"

[tool.pdm.build]
includes = [
    "pants_backend_cmake",
]

[build-system]
requires = ["pdm-backend>2.0"]
build-backend = "pdm.backend"

[tool.isort]
profile = "black"

known_first_party = ["pants_backend_cmake"]
line_length = 100
include_trailing_comma = true

[tool.black]
line-length = 100
