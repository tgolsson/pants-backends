[project]
name = "pants_backend_cargo"
description = "A Pants backend for Rust that wraps Cargo: cargo_workspace and cargo_package targets, a hermetic toolchain, kache-cached builds, and package, run, test, fmt and lint through cargo."
version = "0.1.0"
requires-python = ">=3.11"
authors = [
    { name = "Tom Solberg", email = "me@sbg.dev" }
]

dependencies = ["pants_backend_cc>=0.1.0", "pants_backend_platforms>=0.1.0"]
readme = "README.md"
license = {file = "LICENSE-MIT.txt"}
keywords = ["pantsbuild", "pants", "backend", "rust", "cargo"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Repository = "https://github.com/tgolsson/pants-backends"
Code = "https://github.com/tgolsson/pants-backends/tree/main/pants-plugins/cargo"
Changelog = "https://github.com/tgolsson/pants-backends/tree/main/pants-plugins/cargo/CHANGELOG.md"

[tool.pdm.build]
includes = [
    "pants_backend_cargo",
]

[build-system]
requires = ["pdm-backend>2.0"]
build-backend = "pdm.backend"

[tool.isort]
profile = "black"

known_first_party = ["pants_backend_cargo"]
line_length = 100
include_trailing_comma = true
