[project]
name = "pants_backend_generate"
description = "A Pants backend for code generators whose outputs are committed: typed codegen targets, a `generate` goal that writes the outputs and a linter that checks them."
version = "0.1.0"
authors = [
    { name = "Tom Solberg", email = "me@sbg.dev" }
]

dependencies = []
readme = "README.md"
license = {file = "LICENSE-MIT.txt"}
keywords = ["pantsbuild", "pants", "backend", "codegen", "generate"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Repository = "https://github.com/tgolsson/pants-backends"
Code = "https://github.com/tgolsson/pants-backends/tree/main/pants-plugins/generate"
Changelog = "https://github.com/tgolsson/pants-backends/tree/main/pants-plugins/generate/CHANGELOG.md"

[tool.pdm.build]
includes = [
    "pants_backend_generate",
]

[build-system]
requires = ["pdm-backend>2.0"]
build-backend = "pdm.backend"

[tool.isort]
profile = "black"

known_first_party = ["pants_backend_generate"]
line_length = 100
include_trailing_comma = true

[tool.black]
line-length = 100
